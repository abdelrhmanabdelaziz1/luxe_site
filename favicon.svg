<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#0c0d12" />
    </linearGradient>

    <!-- Vibrant Brand Fire Gradient -->
    <linearGradient id="biteFire" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#d9c29a" />
      <stop offset="35%" stop-color="#b69a6e" />
      <stop offset="100%" stop-color="#826943" />
    </linearGradient>

    <!-- Bright Highlight -->
    <linearGradient id="biteHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#e5d2b4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#b69a6e" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Rim Lighting -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#b69a6e" stroke-opacity="0.25" stroke-width="4" />

  <g transform="translate(10, 0)">
    <!-- Aerodynamic Speed Trails (Left) -->
    <path d="M 100 245 L 210 220" stroke="url(#biteFire)" stroke-width="12" stroke-linecap="round" opacity="0.6" />
    <path d="M 70 282 L 185 264" stroke="url(#biteFire)" stroke-width="14" stroke-linecap="round" opacity="0.9" />
    <path d="M 115 320 L 195 308" stroke="url(#biteFire)" stroke-width="11" stroke-linecap="round" opacity="0.5" />

    <!-- Cloche Top Handle -->
    <ellipse cx="258" cy="186" rx="20" ry="14" fill="url(#biteFire)" filter="url(#glowFilter)" />
    <rect x="250" y="195" width="16" height="12" rx="4" fill="url(#biteFire)" />

    <!-- Rising Hot Steam Plumes -->
    <path d="M 285 158 Q 308 135 298 108 Q 288 85 304 62" fill="none" stroke="url(#biteFire)" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    <path d="M 318 170 Q 345 142 334 114 Q 325 90 342 70" fill="none" stroke="url(#biteFire)" stroke-width="8" stroke-linecap="round" opacity="0.6" />

    <!-- Cloche Main Dome -->
    <!-- Dome Base Shadow / Glow Silhouette -->
    <path d="M 180 326 C 180 228 250 198 335 204 C 392 208 424 256 428 326 Z" fill="url(#biteFire)" filter="url(#glowFilter)" />

    <!-- Inner Sleek Cutout Arc (aerodynamic hollow highlight) -->
    <path d="M 198 318 C 205 248 258 222 316 220 C 265 228 220 260 212 318 Z" fill="#ffffff" opacity="0.45" />

    <!-- Dome Top Sheen / Specular Light -->
    <path d="M 252 222 C 315 220 380 252 396 312 C 360 262 305 238 252 232 Z" fill="url(#biteHighlight)" />

    <!-- Lower Platter / Food Cloche Rim Plate -->
    <!-- Lower Plate Main -->
    <path d="M 152 344 C 160 338 185 334 430 305 C 446 303 456 314 442 324 C 388 360 216 385 160 366 C 146 361 142 350 152 344 Z" fill="url(#biteFire)" />

    <!-- Lower Plate Underlip Shadow -->
    <path d="M 180 372 C 220 384 370 364 420 336 C 410 348 365 372 235 388 C 195 392 170 384 180 372 Z" fill="#826943" opacity="0.75" />
  </g>
</svg>
