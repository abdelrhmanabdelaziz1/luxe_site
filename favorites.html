<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favorite Dishes - BiteHub (EGP)</title>

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="images/favicon.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="luxe.css" />

  <!-- FontAwesome Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>

<body>

  <main class="app profile-app">

    <!-- Subpage Top Bar -->
    <header class="subpage-top-bar">
      <a href="profile.html" class="subpage-back-btn" aria-label="Back to Account Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div class="subpage-title-box">
        <h1>My Favorites</h1>
        <p><span id="favItemCount">0</span> items saved for quick ordering</p>
      </div>
      <button class="icon-circle-btn open-cart-btn" aria-label="Shopping Cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" style="display:none;">0</span>
      </button>
    </header>

    <div class="subpage-container">

      <!-- Favorites Grid Container -->
      <div class="products-grid" id="favoritesGridContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
        <!-- Injected dynamically by JS -->
      </div>

    </div>

    <!-- Bottom Navigation Bar (Home | Orders | Deals | Profile) -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a href="orders.html" class="nav-item">
        <div class="nav-icon-container">
          <i class="fa-solid fa-receipt"></i>
          <span class="nav-badge">1</span>
        </div>
        <span>Orders</span>
      </a>

      <a href="deals.html" class="nav-item">
        <div class="nav-icon-container">
          <i class="fa-solid fa-tag"></i>
        </div>
        <span>Deals</span>
      </a>

      <a href="profile.html" class="nav-item active">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>

  </main>

  <!-- Central App-State Logic -->
  <script src="app-state.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderFavoritesPage();
    });

    function renderFavoritesPage() {
      const isAr = AppState.getLanguage() === 'ar';
      const favIds = AppState.getFavorites();
      const countEl = document.getElementById('favItemCount');
      if (countEl) countEl.textContent = favIds.length;

      const titleEl = document.querySelector('.subpage-title-box h1');
      if (titleEl) titleEl.textContent = isAr ? 'الأطباق المفضلة' : 'My Favorites';
      const subTitleEl = document.querySelector('.subpage-title-box p');
      if (subTitleEl) subTitleEl.innerHTML = isAr ? `<span id="favItemCount">${favIds.length}</span> صنف محفوظ للطلب السريع` : `<span id="favItemCount">${favIds.length}</span> items saved for quick ordering`;

      const container = document.getElementById('favoritesGridContainer');
      if (!container) return;

      if (favIds.length === 0) {
        container.style.display = 'block';
        container.innerHTML = `
          <div style="text-align: center; padding: 48px 20px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: #fee2e2; color: #ef4444; font-size: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
              <i class="fa-regular fa-heart"></i>
            </div>
            <h3 style="font-family: 'Outfit', sans-serif; font-size: 18px; margin: 0 0 6px;">${isAr ? 'لا توجد أطباق مفضلة بعد' : 'No Favorites Saved Yet'}</h3>
            <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 20px; line-height: 1.5;">
              ${isAr ? 'تصفح قائمة الطعام واضغط على رمز القلب لحفظ أطباقك المفضلة هنا لإعادة طلبها بضغطة واحدة!' : 'Explore our menu and tap the heart icon on any gourmet burger, pizza, or shake to save it here for fast 1-tap reordering!'}
            </p>
            <a href="index.html" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 12px 20px; border-radius: 12px;">
              <i class="fa-solid fa-compass"></i> ${isAr ? 'تصفح القائمة' : 'Explore Menu'}
            </a>
          </div>
        `;
        return;
      }

      container.style.display = 'grid';
      container.innerHTML = favIds.map(id => {
        const item = AppState.catalog[id];
        if (!item) return '';
        const itemName = isAr ? (item.nameAr || item.name) : item.name;

        return `
          <div class="product-card" data-product-id="${item.id}" onclick="window.location.href='product-detail.html?id=${item.id}'" style="cursor:pointer; display: flex; flex-direction: column;">
            <div class="product-image-container" style="position: relative; height: 120px; border-radius: 14px; overflow: hidden; background: var(--surface-alt);">
              <img src="${item.image}" alt="${itemName}" style="width: 100%; height: 100%; object-fit: cover;" />
              <button class="fav-btn favorited" onclick="event.stopPropagation(); removeFavoriteItem('${item.id}')" aria-label="Remove favorite" style="position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ef4444; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
                <i class="fa-solid fa-heart"></i>
              </button>
            </div>

            <div class="product-info" style="padding: 10px 4px 4px; flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; color: #f59e0b; margin-bottom: 2px;">
                  <i class="fa-solid fa-star"></i>
                  <strong>${item.rating}</strong>
                  <span style="color: var(--text-secondary); font-size: 10px;">(${item.reviews})</span>
                </div>
                <h4 style="font-size: 13px; font-weight: 700; margin: 0 0 2px; line-height: 1.3;">${itemName}</h4>
              </div>

              <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;">
                <strong style="font-size: 15px; font-family: 'Outfit', sans-serif; color: var(--primary);">
                  ${AppState.formatEGP(item.basePrice)}
                </strong>
                <button class="add-to-cart-btn" onclick="event.stopPropagation(); quickAddFavoriteToCart('${item.id}')" style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #ffffff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;" title="Add to cart">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeFavoriteItem(id) {
      AppState.toggleFavorite(id);
      renderFavoritesPage();
    }

    function quickAddFavoriteToCart(id) {
      const item = AppState.catalog[id];
      if (!item) return;
      AppState.addToCart({
        id: item.id,
        name: item.name,
        nameAr: item.nameAr,
        image: item.image,
        unitPrice: item.basePrice,
        selectedOptions: {},
        quantity: 1
      });
      AppState.openCartDrawer();
    }
  </script>

</body>
</html>
